[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zetsim"
version = "0.1.0"
description = "STM32F103ZET6 and ESP32-S3 embedded project simulator"
requires-python = ">=3.10"
dependencies = [
    "unicorn>=2.1",
    "intelhex",
    "pyelftools",
    "rich",
    "fastapi",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.25"]
windows-pty = ["pywinpty>=2.0; platform_system == 'Windows'"]

[project.scripts]
zetsim = "zetsim.cli:main"

[tool.setuptools.packages.find]
include = ["zetsim*"]

[tool.setuptools.package-data]
zetsim = ["static/*.html", "data/boards/*.json", "data/registers/*.json", "data/soc/*.json"]
