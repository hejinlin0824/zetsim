name: tests

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zetsim-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q zetsim tests

      - name: Run regression suite
        run: python -m pytest tests/ -q

      - name: Validate browser synchronization invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("zetsim/static/index.html").read_text(encoding="utf-8")
          assert "schematicPushQueue" in html, "missing serialized circuit sync queue"
          assert "await pushSchematic()" in html, "boot recovery must await schematic sync"
          assert "lastBoot=s.boot_id" in html, "boot marker is not committed after recovery"
          print("Frontend circuit-sync invariants verified.")
          PY
