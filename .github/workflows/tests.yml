name: tests

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zetsim-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q zetsim tests

      - name: Run regression suite
        run: python -m pytest tests/ -q

      - name: Validate browser synchronization invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("zetsim/static/index.html").read_text(encoding="utf-8")
          assert "schematicPushQueue" in html, "missing serialized circuit sync queue"
          assert "await pushSchematic()" in html, "boot recovery must await schematic sync"
          assert "lastBoot=s.boot_id" in html, "boot marker is not committed after recovery"
          assert "main{flex:1;display:grid;grid-template-columns:196px minmax(0,1fr) 292px" in html, "default grid must allow the canvas column to shrink safely"
          assert "main:has(#leftPanel.hidden){grid-template-columns:minmax(0,1fr) 292px}" in html, "canvas must expand when the left panel is hidden"
          assert "main:has(#rightPanel.hidden){grid-template-columns:196px minmax(0,1fr)}" in html, "canvas must expand when the right panel is hidden"
          assert "main:has(#leftPanel.hidden):has(#rightPanel.hidden){grid-template-columns:minmax(0,1fr)}" in html, "canvas must fill the row when both side panels are hidden"
          assert "return{x:e.clientX-r.left,y:e.clientY-r.top};" in html, "pointer coordinates must remain in CSS pixels across DPR changes"
          assert "const k=cv.width/r.width/devicePixelRatio" not in html, "stale canvas backing-store size must not distort pointer coordinates"
          assert "cv.width!==Math.round(pr.width*dpr)||cv.height!==Math.round(pr.height*dpr)" in html, "polling must repair both canvas backing-store dimensions after DPR changes"
          print("Frontend circuit-sync, responsive-layout, and DPR invariants verified.")
          PY
      - name: Validate learning tools and frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("zetsim/static/index.html").read_text(encoding="utf-8")
          case_ids = ["gpio-blink", "led-marquee", "exti-button", "uart-echo", "pwm-adc", "rc-filter"]
          missing_cases = [case_id for case_id in case_ids if f'id:"{case_id}"' not in html]
          assert not missing_cases, f"missing learning cases: {missing_cases}"
          required = {
              'case library button': 'id="casesBtn"',
              'wiring checker': 'function auditWiring()',
              'MCU power check': 'MCU_VDD',
              'wire duplicate check': 'WIRE_DUP',
              'malformed wire check': 'WIRE_FORMAT',
              'editor line numbers': 'id="lineNums"',
              'unsaved edit state': 'function isProjDirty()',
              'dedicated save action': 'id="projSaveBtn"',
              'save before build': 'if(!await saveProj())return;',
              'case project CTA': '打开 C 项目实战',
              'per-task learning progress': 'function readCaseProgress()',
              'persistent learning progress key': 'zetsim.caseProgress',
              'interactive task checkboxes': 'data-case-task',
              'GPIO project': 'project:"gpio_blink"',
              'marquee project': 'project:"led_marquee"',
              'EXTI project': 'project:"exti_button"',
              'USART project': 'project:"uart_echo"',
              'ADC/PWM project': 'project:"pwm_adc_control"',
              'RC project': 'project:"pwm_rc_filter"',
          }
          missing = [label for label, token in required.items() if token not in html]
          assert not missing, f"missing learning/editor features: {missing}"
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/zetsim-frontend.js").write_text(script, encoding="utf-8")
          print("Learning case library, wiring audit, and editor invariants verified.")
          PY
          node --check /tmp/zetsim-frontend.js
